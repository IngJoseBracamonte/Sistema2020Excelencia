# =========================================================
# Docker Compose -- Sistema Sat Hospitalario
# Orquestador de contenedores para despliegue local y servidor
#
# MySQL corre NATIVO en el host (no containerizado).
# Los contenedores se conectan al MySQL del host via host.docker.internal.
# =========================================================

services:
  # --- Redis (CachÃ© Distribuido) ---
  redis:
    image: redis:7-alpine
    container_name: sat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sat-network
    volumes:
      - redis-data:/data

  # --- WebAPI (.NET 9 Backend) ---
  api:
    # image: ghcr.io/ingjosebracamonte/sistema-sat-api:latest
    build:
      context: ./src
      dockerfile: SistemaSatHospitalario.WebAPI/Dockerfile
    container_name: sat-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      # --- Runtime ---
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=MySql

      # --- Conexiones a MySQL del Host Windows ---
      - ConnectionStrings__mysql-system=server=${MYSQL_HOST:-host.docker.internal};port=${MYSQL_PORT:-3306};database=${MYSQL_SYSTEM_DB:-SatHospitalario};user=${MYSQL_USER:-root};password=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=None
      - ConnectionStrings__mysql-identity=server=${MYSQL_HOST:-host.docker.internal};port=${MYSQL_PORT:-3306};database=${MYSQL_IDENTITY_DB:-SatHospitalarioIdentity};user=${MYSQL_USER:-root};password=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=None
      - ConnectionStrings__LegacyConnection=server=${MYSQL_HOST:-host.docker.internal};port=${MYSQL_PORT:-3306};database=${MYSQL_LEGACY_DB:-sistema2020};user=${MYSQL_USER:-root};password=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=None;Allow User Variables=True
      - ConnectionStrings__Redis=redis:6379

      # --- JWT ---
      - JwtConfig__Secret=${JWT_SECRET}
      - JwtConfig__Issuer=${JWT_ISSUER:-SistemaSatHospitalarioAPI}
      - JwtConfig__Audience=${JWT_AUDIENCE:-SistemaSatHospitalario_PWA}

      # --- CORS ---
      - AllowedOrigins=http://localhost,http://127.0.0.1,http://192.168.10.9,http://JOSEBRACAMONTE,http://SERVIDOREX,http://servidorex

      # --- Deployment ---
      - DeploymentSettings__Mode=Docker
      - DeploymentSettings__ApplyAggressiveRepair=false
      - DeploymentSettings__SkipMigrations=false

      # --- Email ---
      - EmailSettings__SmtpHost=${SMTP_HOST:-}
      - EmailSettings__SmtpPort=${SMTP_PORT:-2525}
      - EmailSettings__SmtpUser=${SMTP_USER:-}
      - EmailSettings__SmtpPass=${SMTP_PASS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo 'Healthcheck skipped' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - sat-network
    volumes:
      - api-logs:/app/Logs

  # --- Frontend (Angular PWA + Nginx Proxy) ---
  frontend:
    # image: ghcr.io/ingjosebracamonte/sistema-sat-frontend:latest
    build:
      context: ./src
      dockerfile: SistemaSatHospitalario.Frontend/Dockerfile
    container_name: sat-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
      - "${HOST_SSL_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - sat-network

  # --- Watchtower ---
  watchtower:
    image: containrrr/watchtower
    container_name: sat-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - DOCKER_API_VERSION=1.41
      - WATCHTOWER_LOG_LEVEL=info
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-false}
    networks:
      - sat-network

  # --- Playwright Bot ---
  playwright-bot:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: sat-playwright-bot
    restart: unless-stopped
    environment:
      - API_URL=http://api:8080/api/Tickets/report
      - BASE_URL=http://frontend:80
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - sat-network

# --- Red Docker ---
networks:
  sat-network:
    driver: bridge
    name: sat-hospital-network

# --- VolÃºmenes Persistentes ---
volumes:
  api-logs:
    name: sat-api-logs
  redis-data:
    name: sat-redis-data




