# =========================================================
# Docker Compose para Desarrollo en Vivo (Live Reload / Auto-Update)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =========================================================

services:
  api:
    build:
      context: ./src
      dockerfile: SistemaSatHospitalario.WebAPI/Dockerfile
      target: dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      # Monta todo el código fuente del backend para dotnet watch
      - ./src:/app
      - /app/SistemaSatHospitalario.WebAPI/bin
      - /app/SistemaSatHospitalario.WebAPI/obj
      - /app/SistemaSatHospitalario.Core.Application/bin
      - /app/SistemaSatHospitalario.Core.Application/obj
      - /app/SistemaSatHospitalario.Core.Domain/bin
      - /app/SistemaSatHospitalario.Core.Domain/obj
      - /app/SistemaSatHospitalario.Infrastructure/bin
      - /app/SistemaSatHospitalario.Infrastructure/obj
      - /app/SistemaSatHospitalario.ServiceDefaults/bin
      - /app/SistemaSatHospitalario.ServiceDefaults/obj
    command: ["dotnet", "watch", "--project", "SistemaSatHospitalario.WebAPI/SistemaSatHospitalario.WebAPI.csproj", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]

  frontend:
    build:
      context: ./src/SistemaSatHospitalario.Frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${HOST_PORT:-80}:80"
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Monta el código de Angular para live reload con ng serve
      - ./src/SistemaSatHospitalario.Frontend:/app
      - /app/node_modules
      - /app/.angular
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "80", "--poll", "2000", "--disable-host-check"]
