# ═══════════════════════════════════════════════════════════
# Nginx Configuration — Sistema Sat Hospitalario
# Reverse Proxy + SPA Routing + WebSocket Support + SSL/HTTPS
# ═══════════════════════════════════════════════════════════

# --- Redirección automática de HTTP (80) a HTTPS (443) ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Servidor Principal HTTPS (443) ---
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Compresión Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # --- Angular SPA (Archivos estáticos y enrutamiento Angular) ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- API Backend Proxy ---
    location /api/ {
        proxy_pass http://sat-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para operaciones largas (reportes PDF, cierres de cuenta)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Buffer para respuestas grandes
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --- SignalR WebSocket Hub (ÚNICO BLOQUE UNIFICADO) ---
    location /hub/ {
        proxy_pass http://sat-api:8080/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket keep-alive largo (24 horas)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Health Check Proxy ---
    location /health {
        proxy_pass http://sat-api:8080/health;
        access_log off;
    }

    # --- Páginas de Error ---
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}